[tool.poetry]
name = "web-boilerplate"
version = "0.1.0"
description = "FastAPI boilerplate"
authors = ["Tomas Matlovic <tomas.matlovic@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "web_boilerplate"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
pydantic-settings = "^2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
aiosqlite = "^0.19.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
